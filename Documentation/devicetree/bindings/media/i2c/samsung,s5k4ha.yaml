%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/samsung,s5k4ha.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S5K4HA and S5K5E9 raw Bayer image sensors

maintainers:
  - Mollomm1 <68751598+Mollomm1@users.noreply.github.com>

description:
  The S5K4HA is an 8 megapixel sensor with a 4-lane MIPI CSI-2 output, the
  S5K5E9 a 5 megapixel sensor with a 2-lane output. Both are controlled over
  I2C and run from a 26 MHz master clock.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    enum:
      - samsung,s5k4ha
      - samsung,s5k5e9

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  vana-supply:
    description: Analogue 2.8 V supply.

  vdig-supply:
    description: Digital core supply.

  vio-supply:
    description: Interface 1.8 V supply.

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        required:
          - data-lanes
          - link-frequencies

required:
  - compatible
  - reg
  - clocks
  - reset-gpios
  - vana-supply
  - vdig-supply
  - vio-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@2d {
            compatible = "samsung,s5k4ha";
            reg = <0x2d>;
            clocks = <&cmu_top 79>;
            reset-gpios = <&gpg3 4 GPIO_ACTIVE_LOW>;
            vana-supply = <&rcam_vana>;
            vdig-supply = <&rcam_vdig>;
            vio-supply = <&cam_vio>;
            orientation = <1>;

            port {
                rcam_out: endpoint {
                    remote-endpoint = <&csis1_in>;
                    data-lanes = <1 2 3 4>;
                    link-frequencies = /bits/ 64 <335400000>;
                };
            };
        };
    };
...
