%YAML 1.2
---
$id: http://devicetree.org/schemas/media/samsung,exynos7885-csis.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos7885 MIPI CSI-2 receiver (CSIS v5)

maintainers:
  - Mollomm1 <68751598+Mollomm1@users.noreply.github.com>

description:
  Each CSIS instance receives one camera sensor over its own D-PHY and can
  write the received frames to memory with a built-in DMA, without the
  camera ISP. The D-PHY is isolated by the PMU and held in reset by the CAM
  system registers; the instances share an arbiter and SRAM for their DMA.

properties:
  compatible:
    const: samsung,exynos7885-csis

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  samsung,pmu-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      - items:
          - description: phandle to the PMU system controller
          - description: offset of the D-PHY isolation register
    description: PMU register that isolates the D-PHY of this instance.

  samsung,sysreg:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      - items:
          - description: phandle to the CAM system registers
          - description: offset of the D-PHY reset register
          - description: reset bit of this instance's D-PHY
    description: CAM system register bit that releases the D-PHY reset.

  samsung,csis-dma:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      - items:
          - description: phandle to the common CSIS DMA block
          - description: index of this instance's DMA in the common block
    description: Common DMA arbitration and SRAM shared by the instances.

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    unevaluatedProperties: false
    description: Input from the sensor.

    properties:
      endpoint:
        $ref: video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            minItems: 1
            maxItems: 4

        required:
          - data-lanes

required:
  - compatible
  - reg
  - interrupts
  - samsung,pmu-syscon
  - samsung,sysreg
  - samsung,csis-dma
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    csis@14410000 {
        compatible = "samsung,exynos7885-csis";
        reg = <0x14410000 0x2000>;
        interrupts = <GIC_SPI 298 IRQ_TYPE_LEVEL_HIGH>;
        samsung,pmu-syscon = <&pmu_system_controller 0x680>;
        samsung,sysreg = <&syscon_cam 0x840 8>;
        samsung,csis-dma = <&csis_dma 1>;

        port {
            csis1_in: endpoint {
                remote-endpoint = <&rcam_out>;
                data-lanes = <1 2 3 4>;
            };
        };
    };
...
