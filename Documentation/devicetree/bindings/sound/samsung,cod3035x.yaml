%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/samsung,cod3035x.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung COD3035X audio codec

maintainers:
  - Mollomm1 <Mollomm1@users.noreply.github.com>

description:
  Headphone and microphone codec inside the Samsung S2MPU08 PMIC package.
  It sits on the SPEEDY bus, which the APM firmware owns, so register
  accesses go through the ACPM IPC service. It exchanges I2S with an ABOX
  UAIF and runs from a master clock that ABOX provides while it streams.
  Its analog microphone inputs are the IN1L and IN2L widgets, with the
  MICBIAS1 supply for routing.

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    const: samsung,cod3035x

  samsung,acpm-ipc:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      - items:
          - description: ACPM IPC node.
          - description: ACPM channel of the PMIC/codec register service.
    description: ACPM IPC provider and channel used for register accesses.

  clocks:
    maxItems: 1

  clock-names:
    const: mclk

  "#sound-dai-cells":
    const: 0

required:
  - compatible
  - samsung,acpm-ipc
  - clocks
  - clock-names
  - "#sound-dai-cells"

unevaluatedProperties: false

examples:
  - |
    audio-codec {
        compatible = "samsung,cod3035x";
        samsung,acpm-ipc = <&acpm_ipc 2>;
        clocks = <&abox>;
        clock-names = "mclk";
        #sound-dai-cells = <0>;
    };
