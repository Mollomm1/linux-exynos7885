%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/samsung,exynos7885-abox.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos7885 ABOX audio processor

maintainers:
  - Mollomm1 <Mollomm1@users.noreply.github.com>

description: |
  The Exynos7885 audio processor has control registers, a system register
  aperture, and local SRAM. A reserved DRAM firmware region may be assigned
  through memory-region for the ABOX remote processor.

properties:
  compatible:
    const: samsung,exynos7885-abox

  reg:
    items:
      - description: ABOX control registers
      - description: Audio system registers
      - description: ABOX local SRAM
      - description: ABOX local GIC distributor
      - description: ABOX local GIC CPU interface

  reg-names:
    items:
      - const: sfr
      - const: sysreg
      - const: sram
      - const: gicd
      - const: gicc

  interrupts:
    maxItems: 1

  interrupt-names:
    items:
      - const: abox

  clocks:
    minItems: 8
    maxItems: 12

  clock-names:
    minItems: 8
    items:
      - const: pll
      - const: ca7
      - const: audif
      - const: uaif3-div
      - const: uaif3-mux
      - const: aclk
      - const: uaif3-bclk
      - const: uaif3-sync
      - const: uaif0-div
      - const: uaif0-mux
      - const: uaif0-bclk
      - const: uaif0-sync

  pinctrl-names:
    items:
      - const: active
      - const: idle

  pinctrl-0: true

  pinctrl-1: true

  memory-region:
    minItems: 1
    maxItems: 2
    description: Firmware DRAM carveout and optional PCM ring buffer.

  iommus:
    maxItems: 1

  samsung,bootargs:
    $ref: /schemas/types.yaml#/definitions/string
    description:
      Option string the firmware reads from SRAM at boot. The SM-T510 passes
      "init=ab0x vss=0"; without vss=0 the firmware writes to a modem voice
      buffer that WiFi-only boards do not map.

  samsung,bootargs-offset:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: SRAM offset of samsung,bootargs, past the firmware image.

  power-domains:
    maxItems: 1
    description: DISPAUD power domain containing the ABOX processor.

  "#clock-cells":
    const: 0
    description:
      Codec master clock driven on the UAIF2 clock pin. It runs only while
      the ABOX firmware is up.

patternProperties:
  "^abox-audio$":
    type: object
    properties:
      compatible:
        const: samsung,exynos7885-abox-audio

      "#sound-dai-cells":
        description:
          With one cell, DAI 0 is UAIF3 (speaker amplifiers), DAI 1 is
          UAIF0 (headphone codec) and DAI 2 is the UAIF0 input (codec
          microphones).
        enum: [0, 1]

      status: true

    required:
      - compatible
      - "#sound-dai-cells"

    additionalProperties: false

  "^firmware-[a-z0-9-]+$":
    type: object
    properties:
      status: true

      samsung,name:
        $ref: /schemas/types.yaml#/definitions/string
        description: Firmware path passed to request_firmware().

      samsung,area:
        $ref: /schemas/types.yaml#/definitions/uint32
        const: 1
        description: Firmware is copied into the DRAM carveout.

      samsung,offset:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: Byte offset within the DRAM carveout.

    required:
      - samsung,name
      - samsung,area
      - samsung,offset

    additionalProperties: false

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - power-domains

dependencies:
  samsung,bootargs: [ "samsung,bootargs-offset" ]

additionalProperties: false

examples:
  - |
    pd_dispaud: power-domain@11c84020 {
        compatible = "samsung,exynos7885-dispaud-pd";
        reg = <0x11c84020 0x20>;
        #power-domain-cells = <0>;
    };

    audio-controller@14a50000 {
        compatible = "samsung,exynos7885-abox";
        reg = <0x14a50000 0x10000>,
              <0x14820000 0x10000>,
              <0x14b00000 0x28000>,
              <0x14af1000 0x1000>,
              <0x14af2000 0x1004>;
        reg-names = "sfr", "sysreg", "sram", "gicd", "gicc";
        interrupts = <GIC_SPI 119 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "abox";
        clocks = <&cmu_dispaud 1>, <&cmu_dispaud 13>,
                 <&cmu_dispaud 2>, <&cmu_dispaud 3>,
                 <&cmu_dispaud 16>, <&cmu_dispaud 5>,
                 <&cmu_dispaud 7>, <&cmu_dispaud 8>;
        clock-names = "pll", "ca7", "audif", "uaif3-div",
                      "uaif3-mux", "aclk",
                      "uaif3-bclk", "uaif3-sync";
        power-domains = <&pd_dispaud>;
    };
...
