%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/samsung/samsung,exynos7885-wifibt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos7885 WiFi and Bluetooth subsystem

maintainers:
  - Mollomm1 <68751598+Mollomm1@users.noreply.github.com>

description: |
  Integrated wireless subsystem with R4 and M4 mailbox banks and a shared
  DRAM region. The PMU controls subsystem power and reset. Firmware and host
  communicate through mailboxes and the reserved memory region.

properties:
  compatible:
    const: samsung,exynos7885-wifibt

  reg:
    items:
      - description: R4 mailbox
      - description: M4 mailbox

  reg-names:
    items:
      - const: r4
      - const: m4

  interrupts:
    items:
      - description: Mailbox to application processor
      - description: Subsystem alive
      - description: Watchdog

  interrupt-names:
    items:
      - const: mbox
      - const: alive
      - const: watchdog

  samsung,pmu-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: PMU system controller

  memory-region:
    maxItems: 1
    description: Reserved shared DRAM, marked no-map

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - samsung,pmu-syscon
  - memory-region

additionalProperties: false
