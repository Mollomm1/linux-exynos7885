%YAML 1.2
---
$id: http://devicetree.org/schemas/mailbox/samsung,exynos7885-acpm-mbox.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos7885 ACPM mailbox

maintainers:
  - Mollomm1 <mollomm1@users.noreply.github.com>

description:
  Doorbell mailbox between the application processor and the ACPM firmware.
  The AP generates an APM interrupt by writing bit 16 plus the channel ID
  to the INTGR0 register at offset 0x08.

properties:
  compatible:
    const: samsung,exynos7885-acpm-mbox

  reg:
    maxItems: 1

  '#mbox-cells':
    const: 0

required:
  - compatible
  - reg
  - '#mbox-cells'

additionalProperties: false

examples:
  - |
    mailbox@11c40000 {
        compatible = "samsung,exynos7885-acpm-mbox";
        reg = <0x11c40000 0x1000>;
        #mbox-cells = <0>;
    };
