%YAML 1.2
---
$id: http://devicetree.org/schemas/firmware/samsung,exynos7885-acpm-ipc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos7885 ACPM IPC

maintainers:
  - Mollomm1 <mollomm1@users.noreply.github.com>

description:
  The ACPM firmware uses the APM SRAM for its channel descriptors and
  message rings. Its framework descriptor is at offset 0x4b80 in the SRAM.

properties:
  compatible:
    const: samsung,exynos7885-acpm-ipc

  mboxes:
    maxItems: 1

  shmem:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: APM SRAM region containing channel descriptors and rings.

required:
  - compatible
  - mboxes
  - shmem

additionalProperties: false

examples:
  - |
    power-management {
        compatible = "samsung,exynos7885-acpm-ipc";
        mboxes = <&ap2apm_mailbox>;
        shmem = <&apm_sram>;
    };
