%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/samsung,s2mu005-charger.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S2MU005 charger and OTG boost converter

maintainers:
  - Mollomm1 <68751598+Mollomm1@users.noreply.github.com>

description:
  Charger child of the S2MU005 PMIC. Charge and boost modes are mutually
  exclusive. Battery temperature is measured by an external ADC and NTC.

properties:
  compatible:
    const: samsung,s2mu005-charger
  samsung,usb-port:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Type-C controller reporting the available sink power. This is resolved
      after probe because that controller consumes this charger's VBUS regulator.
  monitored-battery: true
  io-channels:
    maxItems: 1
  io-channel-names:
    const: battery-temperature
  samsung,temperature-adc-limits:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    items:
      - description: Hot cutoff, raw ADC reading
      - description: Recovery from hot, raw ADC reading
      - description: Recovery from cold, raw ADC reading
      - description: Cold cutoff, raw ADC reading
    description:
      Strictly increasing raw readings for an NTC whose reading decreases
      with increasing temperature. Both cutoff boundaries inhibit charging.
  vbus:
    $ref: /schemas/regulator/regulator.yaml#
    unevaluatedProperties: false

required:
  - compatible
  - samsung,usb-port
  - monitored-battery
  - io-channels
  - io-channel-names
  - samsung,temperature-adc-limits
  - vbus

additionalProperties: false
