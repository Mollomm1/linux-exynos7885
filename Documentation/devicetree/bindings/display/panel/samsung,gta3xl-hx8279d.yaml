%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/samsung,gta3xl-hx8279d.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Himax HX8279D panel of the Samsung Galaxy Tab A 10.1 (2019)

maintainers:
  - Mollomm1 <68751598+Mollomm1@users.noreply.github.com>

description:
  1200x1920 video-mode MIPI DSI panel with a Himax HX8279D controller, used
  in the Samsung SM-T510. Its backlight is controlled over DSI.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: samsung,gta3xl-hx8279d

  reg:
    maxItems: 1

  port: true
  reset-gpios: true

required:
  - compatible
  - reg
  - port
  - reset-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "samsung,gta3xl-hx8279d";
            reg = <0>;
            reset-gpios = <&gpg1 7 GPIO_ACTIVE_LOW>;

            port {
                endpoint {
                    remote-endpoint = <&dsi_out>;
                };
            };
        };
    };
