%YAML 1.2
---
$id: http://devicetree.org/schemas/display/samsung/samsung,exynos7885-dpu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos7885 display processing unit

maintainers:
  - Mollomm1 <68751598+Mollomm1@users.noreply.github.com>

description: |
  DECON0 and the IDMA_G0 pixel DMA channel of the Exynos7885 DPU. The
  binding describes the pipeline that the bootloader leaves running in DSI
  video mode, with the panel timing it was programmed for. Its output goes
  to the DSI host through the port.

properties:
  compatible:
    const: samsung,exynos7885-dpu

  reg:
    minItems: 2
    items:
      - description: DECON0 registers
      - description: IDMA_G0 registers, the scanout channel
      - description: IDMA_G1 registers, for an overlay plane
      - description: IDMA_GF registers, for a cursor plane

  reg-names:
    minItems: 2
    items:
      - const: decon
      - const: idma-g0
      - const: idma-g1
      - const: idma-gf

  interrupts:
    items:
      - description: DECON0 frame start

  interrupt-names:
    items:
      - const: frame-start

  power-domains:
    maxItems: 1

  iommus:
    maxItems: 1

  memory-region:
    maxItems: 1
    description:
      The framebuffer the bootloader scans out. With an IOMMU, the region
      needs an identity mapping (iommu-addresses) for this device, since
      the scanout continues from it while the IOMMU is enabled.

  panel-timing:
    $ref: /schemas/display/panel/panel-timing.yaml#

  port:
    $ref: /schemas/graph.yaml#/properties/port
    description: Output to the DSI host.

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - panel-timing
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    display-controller@14860000 {
        compatible = "samsung,exynos7885-dpu";
        reg = <0x14860000 0x10000>, <0x148b1000 0x1000>,
              <0x148b2000 0x1000>, <0x148b3000 0x1000>;
        reg-names = "decon", "idma-g0", "idma-g1", "idma-gf";
        interrupts = <GIC_SPI 114 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "frame-start";

        port {
            endpoint {
                remote-endpoint = <&dsi_in>;
            };
        };

        panel-timing {
            clock-frequency = <164976000>;
            hactive = <1200>;
            vactive = <1920>;
            hfront-porch = <150>;
            hback-porch = <40>;
            hsync-len = <10>;
            vfront-porch = <22>;
            vback-porch = <18>;
            vsync-len = <4>;
        };
    };
