%YAML 1.2
---
$id: http://devicetree.org/schemas/display/samsung/samsung,exynos7885-dsim.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos7885 MIPI DSI host (DSIM)

maintainers:
  - Mollomm1 <68751598+Mollomm1@users.noreply.github.com>

description: |
  DSIM of the Exynos7885 display processing unit. Its input is the DPU
  (port 0) and its output a DSI panel (port 1), which is also described
  as a child node of the host.

allOf:
  - $ref: /schemas/display/dsi-controller.yaml#

properties:
  compatible:
    const: samsung,exynos7885-dsim

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  power-domains:
    maxItems: 1

  samsung,pmu-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      PMU system controller, which isolates the D-PHY while the link is
      off.

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

    properties:
      port@0:
        $ref: /schemas/graph.yaml#/properties/port
        description: Input from the DPU.

      port@1:
        $ref: /schemas/graph.yaml#/properties/port
        description: Output to the DSI panel.

    required:
      - port@0
      - port@1

required:
  - compatible
  - reg
  - samsung,pmu-syscon
  - ports

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    dsi@14870000 {
        compatible = "samsung,exynos7885-dsim";
        reg = <0x14870000 0x100>;
        interrupts = <GIC_SPI 125 IRQ_TYPE_LEVEL_HIGH>;
        samsung,pmu-syscon = <&pmu_system_controller>;
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "samsung,gta3xl-hx8279d";
            reg = <0>;

            port {
                panel_in: endpoint {
                    remote-endpoint = <&dsi_out>;
                };
            };
        };

        ports {
            #address-cells = <1>;
            #size-cells = <0>;

            port@0 {
                reg = <0>;
                dsi_in: endpoint {
                    remote-endpoint = <&dpu_out>;
                };
            };

            port@1 {
                reg = <1>;
                dsi_out: endpoint {
                    remote-endpoint = <&panel_in>;
                };
            };
        };
    };
