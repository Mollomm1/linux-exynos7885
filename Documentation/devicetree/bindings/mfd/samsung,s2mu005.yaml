%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/samsung,s2mu005.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S2MU005 interface PMIC

maintainers:
  - Mollomm1 <68751598+Mollomm1@users.noreply.github.com>

description:
  Interface PMIC containing a charger, OTG boost converter, and USB data switch.
  The fuel gauge has a separate I2C address and is not a child of this device.

properties:
  compatible:
    const: samsung,s2mu005
  reg:
    maxItems: 1
  interrupts:
    maxItems: 1
  mux-controller:
    $ref: /schemas/mux/samsung,s2mu005-mux.yaml#
  charger:
    $ref: /schemas/power/supply/samsung,s2mu005-charger.yaml#

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false
