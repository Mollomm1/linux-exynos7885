%YAML 1.2
---
$id: http://devicetree.org/schemas/mux/samsung,s2mu005-mux.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S2MU005 USB data switch

maintainers:
  - Mollomm1 <68751598+Mollomm1@users.noreply.github.com>

description:
  Child of the S2MU005 PMIC. State 0 opens D+/D-; state 1 routes them to
  the application processor. The idle state is open.

properties:
  compatible:
    const: samsung,s2mu005-mux
  '#mux-control-cells':
    const: 0

required:
  - compatible
  - '#mux-control-cells'

additionalProperties: false
