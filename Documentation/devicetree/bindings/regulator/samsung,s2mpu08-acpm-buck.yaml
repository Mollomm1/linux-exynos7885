%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/samsung,s2mpu08-acpm-buck.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S2MPU08 buck and LDO control over ACPM

maintainers:
  - Mollomm1 <68751598+Mollomm1@users.noreply.github.com>

description:
  On Exynos7885 boards the S2MPU08 PMIC is reached through ACPM. This
  describes the output voltage control of one buck, BUCK2 (vdd_cpucl0,
  the A73 cluster), BUCK3 (vdd_cpucl12, the A53 clusters) or BUCK5
  (vdd_g3d, the Mali GPU). Switching the buck on and off stays with the
  PMU. It also describes LDO2 and LDO35, the SD card I/O and card
  supplies, which are switched on and off as well as set.

allOf:
  - $ref: regulator.yaml#

properties:
  compatible:
    enum:
      - samsung,s2mpu08-acpm-buck2
      - samsung,s2mpu08-acpm-buck3
      - samsung,s2mpu08-acpm-buck5
      - samsung,s2mpu08-acpm-ldo2
      - samsung,s2mpu08-acpm-ldo35

  samsung,acpm-ipc:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      - items:
          - description: ACPM IPC node
          - description: ACPM channel of the PMIC
    description: ACPM interface and channel used to reach the PMIC.

required:
  - compatible
  - samsung,acpm-ipc

unevaluatedProperties: false

examples:
  - |
    regulator-vdd-g3d {
        compatible = "samsung,s2mpu08-acpm-buck5";
        samsung,acpm-ipc = <&acpm_ipc 2>;
        regulator-name = "vdd_g3d";
        regulator-min-microvolt = <750000>;
        regulator-max-microvolt = <900000>;
    };
